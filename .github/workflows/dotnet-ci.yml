name: .NET CI

on:
  pull_request:
    branches:
      - main
      - work/grok-spotify-auth
      - work/gpt-lead-cyrillic
  workflow_dispatch:

concurrency:
  group: tunebridge-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TuneBridge.sln

      - name: Build
        run: dotnet build TuneBridge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TuneBridge.sln --configuration Release --no-build --logger "trx;LogFileName=tunebridge-tests.trx"

      - name: Publish Windows x64 single-file app
        run: dotnet publish src/TuneBridge.Desktop/TuneBridge.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true --output publish/win-x64

      - name: Upload Windows x64 app
        uses: actions/upload-artifact@v4
        with:
          name: TuneBridge-win-x64
          path: publish/win-x64/**
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunebridge-test-results
          path: "**/tunebridge-tests.trx"
          if-no-files-found: ignore
